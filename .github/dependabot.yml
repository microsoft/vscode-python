version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: 'github-actions'
    directories:
      - /
      - /.github/actions/build-vsix
      - /.github/actions/lint
      - /.github/actions/smoke-tests
    patterns: ['*']
    multi-ecosystem-group: dependencies
    labels:
      - 'dependencies'
      - 'no-changelog'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directories:
      - /
      - /pythonExtensionApi
    patterns: ['*']
    multi-ecosystem-group: dependencies
    labels:
      - 'dependencies'
      - 'no-changelog'
      - 'skip package*.json'

  # Not skipping the news for some Python dependencies in case it's actually useful to communicate to users.
  - package-ecosystem: 'pip'
    directories:
      - /
      - /build
      - /python_files/jedilsp_requirements
    patterns: ['*']
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: prospector # Due to Python 2.7 and #14477.
      - dependency-name: pytest # Due to Python 2.7 and #13776.
      - dependency-name: py # Due to Python 2.7.
      - dependency-name: jedi-language-server
    labels:
      - 'dependencies'
      - 'no-changelog'
