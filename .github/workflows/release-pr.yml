name: Release PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  plan:
    name: Release PR / Plan
    runs-on: ubuntu-latest
    steps:
      - name: Validate release candidate
        id: plan
        uses: microsoft/vscode-python-ci/actions/release-pr@4e0c4335bbf6b1a274673e22d9c39cd7efb93ccf
        with:
          mode: plan
      - name: Summarize release candidate
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          if [[ -n "$VERSION" ]]; then
            echo "Validated release candidate: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Not a release candidate. Release bumps must change only root package.json." >> "$GITHUB_STEP_SUMMARY"
          fi
