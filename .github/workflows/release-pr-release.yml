name: Release PR Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  release:
    name: Release PR / Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare release branch
        id: release
        uses: microsoft/vscode-python-ci/actions/release-pr@4e0c4335bbf6b1a274673e22d9c39cd7efb93ccf
        with:
          mode: release
      - name: Summarize release branch
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
        shell: bash
        run: |
          if [[ -n "$VERSION" ]]; then
            echo "Created release branch: $BRANCH (stable version $VERSION)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Not a release candidate; no branch created." >> "$GITHUB_STEP_SUMMARY"
          fi
