name: $(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  repositories:
    - repository: MicroBuildTemplate
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release

variables:
  - name: TeamName
    value: vscode-python
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: skipNugetSecurityAnalysis
    value: true

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    settings:
      networkIsolationPolicy: Preferred,GitHub,NodeTool
    sdl:
      sourceAnalysisPool:
        name: AzurePipelines-EO
        image: 1ESPT-Windows2022
        os: windows
      bandit:
        enabled: false
      antimalwareScan:
        enabled: true
      componentgovernance:
        enabled: true
        ignoreDirectories: .github,build,news
      credscan:
        enabled: true
        verboseOutput: true
      eslint:
        enabled: false
      policheck:
        enabled: true
      publishLogs:
        enabled: true
      sdtReport:
        enabled: true
      tsa:
        enabled: false
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Windows2022
      os: windows

    customBuildTags:
      - ES365AIMigrationTooling

    stages:
      - stage: StaticAnalysis
        displayName: Static analysis
        jobs:
          - job: StaticAnalysis
            displayName: Static analysis
            templateContext:
              sdl:
                publishLogs:
                  enabled: false
              outputs:
                - output: pipelineArtifact
                  targetPath: '$(Build.ArtifactStagingDirectory)\bandit'
                  artifactName: BanditResults
                  isProduction: false
            steps:
              - checkout: self
                clean: true
                fetchDepth: 0

              - task: UsePythonVersion@0
                inputs:
                  versionSpec: 3.x
                  addToPath: true
                  architecture: x64
                displayName: Use Python 3.x

              - pwsh: |
                  $pythonFiles = Get-ChildItem -Path '$(Build.SourcesDirectory)\python_files' -Filter '*.py' -Recurse -File |
                      Where-Object { $_.FullName -notlike '*\python_files\tests\*' }
                  if ($pythonFiles.Count -eq 0) {
                      throw 'Bandit target contains no Python files.'
                  }

                  Write-Host "Bandit will scan $($pythonFiles.Count) Python files."
                displayName: Verify Bandit target

              - task: Bandit@1
                continueOnError: true
                inputs:
                  aggregate: vuln
                  baseline: ''
                  configFile: ''
                  contextLines: ''
                  customRules: ''
                  debug: false
                  excludedPaths: ''
                  ignoreNosec: false
                  minConfidence: low
                  minSeverity: Low
                  policyName: Microsoft
                  profile: ''
                  quiet: false
                  ruleset: guardian
                  skippedRules: ''
                  targets: 'f|$(Build.SourcesDirectory)\python_files\**\*.py;-|.gdn\**;-|$(Build.SourcesDirectory)\python_files\tests\**\*.py'
                  targetsBandit: $(Build.SourcesDirectory)
                  targetsBanditRecursive: true
                  targetsType: guardianGlob
                  verbose: false
                displayName: Run Bandit

              - pwsh: |
                  $banditResults = '$(Pipeline.Workspace)\.gdn\.r\bandit'
                  if (-not (Test-Path -LiteralPath $banditResults -PathType Container)) {
                      throw "Bandit results directory was not found: $banditResults"
                  }
                  if (-not (Get-ChildItem -LiteralPath $banditResults -Filter '*.sarif' -Recurse -File)) {
                      throw "Bandit SARIF was not found: $banditResults"
                  }

                  Copy-Item -LiteralPath $banditResults -Destination '$(Build.ArtifactStagingDirectory)' -Recurse -Force
                displayName: Stage Bandit results
